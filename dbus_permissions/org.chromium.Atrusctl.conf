<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <policy user="root">
        <allow own="org.chromium.Atrusctl"/>
        <allow send_destination="org.chromium.Atrusctl"
               send_interface="org.chromium.Atrusctl"
               send_member="ForceFirmwareUpgrade"/>
        <allow send_destination="org.chromium.Atrusctl"
               send_interface="org.chromium.Atrusctl"
               send_member="EnableDiagnostics"/>
        <allow send_destination="org.chromium.Atrusctl"
               send_interface="org.chromium.Atrusctl"
               send_member="DisableDiagnostics"/>
    </policy>
    <policy user="atrus">
        <allow own="org.chromium.Atrusctl"/>
    </policy>
    <policy context="default">
        <deny send_destination="org.chromium.Atrusctl"/>
    </policy>
</busconfig>
